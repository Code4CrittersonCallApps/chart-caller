const GLOSS=[["Elliott Wave","Markets move in 5-wave impulses (1-2-3-4-5) in the trend direction and 3-wave corrections (A-B-C) against it. Wave 3 is usually the longest and strongest; wave 5 often comes with divergence; wave 2 often retraces .618 of wave 1."],
["Wave C","The final leg of an A-B-C correction. It often ends in capitulation, which is where the cycle lows form."],
["Fib .618 / .786","Fibonacci retracement levels. The .618 'golden pocket' is the classic pullback buy in an uptrend. The .786 is the last-line deep retrace before the structure is invalidated."],
["Bull flag","A sharp rally (the pole) followed by a tight, down-sloping consolidation (the flag). A breakout targets roughly the pole's length."],
["Head & Shoulders (H&S)","Three peaks with the middle one highest. A break of the neckline confirms a top. The inverse version is a bottom."],
["Double top / bottom","Two tests of the same high or low. Confirmed on a break of the neckline (the swing between them)."],
["Wyckoff accumulation","A sideways base where smart money absorbs supply: selling climax → range → spring → sign of strength → markup."],
["Wyckoff spring","A quick break below range support that reverses back inside. It traps shorts and runs stops. The stop goes under the spring low."],
["Deviation / upthrust","The mirror image of a spring: a poke above range highs that fails back inside. It traps breakout longs."],
["BCB-style retest","Blockchain Backer's idea: after a key level (like the 50-week MA or a range high) breaks, wait for price to come back and hold it from the other side before trusting the move."],
["50W MA","The 50-week moving average, a cycle-trend gauge. Above it and holding = bull regime; lost = bear regime."],
["EMA 21 / 55","Fast and slow exponential moving averages. 21 above 55 with price above both = trend up. Distance above the 21 = overextension."],
["RSI","Relative Strength Index (14). Above 70 is overbought, below 30 oversold. Use it for divergence more than for levels."],
["Bearish / bullish divergence","Price makes a higher high while RSI makes a lower high (bearish), or a lower low while RSI makes a higher low (bullish). Momentum is fading."],
["Bear trap","A breakdown below support that quickly reclaims. Shorts get squeezed."],
["Long trap / bull trap","A breakout above resistance that fails. Late longs get liquidated."],
["Capitulation","A panic flush on huge volume where forced sellers exit. It often marks major lows (the big wick)."],
["Blow-off top","A parabolic final move with extreme RSI. Euphoria peaks and reverses violently."],
["S/R flip","Old resistance becomes support (or vice versa). The retest of the flip is the entry."],
["Setup tier (S/A/B/C)","Graded here from REAL data. Risk = distance to the logical stop (the 20-bar swing low for longs, the swing high for shorts). Reward = the best move in the call's direction afterward. S ≥ 5R, A ≥ 3R, B ≥ 1.5R; C = under 1.5R, the stop got hit, or chop."],
["R (R-multiple)","Reward divided by risk. 3R = you made 3x what you risked."],
["Sell the news","Price runs up into a known catalyst, then dumps when it happens."]];

let mode=localStorage.ccMode||"normal",st=JSON.parse(localStorage.ccSt||'{"xp":0,"streak":0,"best":0,"right":0,"total":0}'),ind=false;
const LV=[["Bronze",0],["Silver",300],["Gold",800],["Platinum",1500],["Diamond",2500],["S-Tier Caller",4000]];
const $=id=>document.getElementById(id);
function lvl(){let i=0;LV.forEach((l,k)=>{if(st.xp>=l[1])i=k});return i}
function hud(){const i=lvl();$("lvl").textContent=LV[i][0];$("xp").textContent=st.xp;$("streak").textContent=st.streak;
 const nx=LV[i+1];$("lvlbar").style.width=nx?(100*(st.xp-LV[i][1])/(nx[1]-LV[i][1]))+"%":"100%";$("lvlnext").textContent=nx?`${nx[1]-st.xp} XP to ${nx[0]}`:"Max rank: S-Tier Caller.";
 localStorage.ccSt=JSON.stringify(st);document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m==mode))}
$("nsc").textContent=SC.length;
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{mode=localStorage.ccMode=b.dataset.m;hud()});
$("gl").innerHTML=GLOSS.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("");
function show(id){["home","game","gloss"].forEach(s=>$(s).classList.toggle("hide",s!=id));scrollTo(0,0)}
let tt;function toast(t,c){const e=$("toast");e.textContent=t;e.style.color=c;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,900)}
let run=[],ri=0,cur,qs,qi,chart,rc,cs,revealed=0,timer=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(all){run=shuffle(SC.slice());if(!all)run=run.slice(0,10);ri=0;show("game");load()}
const f=v=>v>=1000?"$"+Math.round(v).toLocaleString():v>=1?"$"+v.toFixed(2):"$"+v.toPrecision(3);
function ema(v,n){const k=2/(n+1);let o=[],e;v.forEach((x,i)=>{e=i?x*k+e*(1-k):x;o.push(e)});return o}
function sma(v,n){return v.map((x,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b)/n)}
function rsi(v,n=14){let o=[null],g=0,l=0;for(let i=1;i<v.length;i++){const d=v[i]-v[i-1],up=Math.max(d,0),dn=Math.max(-d,0);if(i<=n){g+=up/n;l+=dn/n;o.push(i==n?100-100/(1+g/(l||1e-9)):null)}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n;o.push(100-100/(1+g/(l||1e-9)))}}return o}
function toggleInd(){ind=!ind;$("indbtn").textContent="Indicators: "+(ind?"on":"off");$("indbtn").classList.toggle("on",ind);$("rsiwrap").classList.toggle("hide",!ind);$("legend").classList.toggle("hide",!ind);if(cur&&!timer)draw()}
function load(){
 cur=run[ri];revealed=0;const s=cur,tfn=s.tf=="W"?"weeks":"days",th=s.th;
 qs=[{k:"move",q:`Next ${s.fwd} ${tfn}: where does price go from ${f(s.c0)}?`,o:[`📈 Up ${th}%+`,`📉 Down ${th}%+`,`↔️ Chop (±${th}%)`],a:{up:0,down:1,chop:2}[s.move]}];
 const useWave=s.wave&&(!s.pat||ri%2==1);
 if(useWave)qs.push({k:"wave",q:"Elliott wave: where are we?",o:s.wave[0],a:s.wave[1]});
 else if(s.pat){const p=shuffle(s.pat[1].map((_,i)=>i));qs.push({k:"pat",q:s.pat[0],o:p.map(i=>s.pat[1][i]),a:p.indexOf(s.pat[2])})}
 qs.push({k:"tier",q:"How good was this setup?",o:["S: monster (5R+)","A: great (3–5R)","B: okay (1.5–3R)","C: skip it (stopped / chop)"],a:"SABC".indexOf(s.tier)});
 qi=0;const blind=mode=="hard";
 $("hdr").textContent=`${ri+1}/${run.length} · `+(blind?"🕶️ Blind "+(s.tf=="W"?"weekly":"daily"):`${s.sym} ${s.tf=="W"?"weekly":"daily"} · ${s.cut}`);
 draw();ask()}
const OPT={layout:{background:{color:"#141a24"},textColor:"#94a3b8",fontSize:12},grid:{vertLines:{visible:false},horzLines:{color:"#ffffff0a"}},
 rightPriceScale:{borderVisible:false,mode:1},crosshair:{mode:0},handleScroll:false,handleScale:false,kineticScroll:{touch:false,mouse:false},autoSize:true};
function draw(){
 if(chart){chart.remove();chart=null}if(rc){rc.remove();rc=null}
 const s=cur;chart=LightweightCharts.createChart($("chart"),{...OPT,timeScale:{borderVisible:false,visible:mode!="hard"}});
 cs=chart.addCandlestickSeries({upColor:"#22c55e",downColor:"#ef4444",borderVisible:false,wickUpColor:"#22c55e",wickDownColor:"#ef4444",priceLineVisible:false});
 const all=s.pre.concat(s.post.slice(0,revealed)),off=Math.max(0,s.pre.length-s.show);
 cs.setData(all.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4]})).slice(off));
 cs.createPriceLine({price:s.c0,color:"#facc15aa",lineStyle:2,title:"now"});
 if(revealed)cs.setMarkers([{time:s.pre[s.pre.length-1][0],position:"aboveBar",color:"#facc15",shape:"arrowDown",text:"CUT"}]);
 const c=all.map(r=>r[4]);
 if(ind){[[ema(c,21),"#facc15"],[ema(c,55),"#a855f7"],[sma(c,50),"#38bdf8"]].forEach(([v,col])=>{const l=chart.addLineSeries({color:col,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});l.setData(all.map((r,i)=>({time:r[0],value:v[i]})).slice(off).filter(p=>p.value!=null))});
  rc=LightweightCharts.createChart($("rsi"),{...OPT,rightPriceScale:{borderVisible:false},timeScale:{visible:false}});
  const rv=rsi(c),rl=rc.addLineSeries({color:"#38bdf8",lineWidth:1,priceLineVisible:false});rl.setData(all.map((r,i)=>({time:r[0],value:rv[i]})).slice(off).filter(p=>p.value!=null));
  [70,30].forEach(v=>rl.createPriceLine({price:v,color:"#ffffff40",lineStyle:2,axisLabelVisible:false}));
  chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&rc)rc.timeScale().setVisibleLogicalRange(r)})}
 chart.timeScale().fitContent();
}
// autoSize handles resize/zoom; refit on size change so reveal never drifts
new ResizeObserver(()=>{if(chart)requestAnimationFrame(()=>chart&&chart.timeScale().fitContent())}).observe(document.querySelector(".chartbox"));
let roundPts=0,answers=[];
function ask(){if(qi==0){roundPts=0;answers=[]}const q=qs[qi];
 $("qbox").innerHTML=`<p class="muted" style="margin:14px 0 0;font-size:15px">Question ${qi+1} of ${qs.length}</p><h2>${q.q}</h2>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${o}</button>`).join("")}`}
function pick(i,btn){const q=qs[qi],ok=i==q.a;document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k==q.a)b.classList.add("ok")});if(!ok)btn.classList.add("bad");
 st.total++;if(ok){st.right++;st.streak++;st.best=Math.max(st.best,st.streak);const m=Math.min(1+Math.floor(st.streak/3)*.5,3),p=Math.round((q.k=="move"?100:q.k=="tier"?80:60)*m*(mode=="hard"?1.5:mode=="easy"?.75:1));roundPts+=p;st.xp+=p;toast(`+${p} XP${m>1?" ×"+m:""}`,"#22c55e")}else{st.streak=0;toast("✗ streak reset","#ef4444")}
 answers.push(ok);hud();setTimeout(()=>{qi++;qi<qs.length?ask():reveal()},ok?600:1100)}
function reveal(){const s=cur;$("qbox").innerHTML=`<h2>⏩ Playing what really happened…</h2>`;
 timer=setInterval(()=>{revealed++;const r=s.post[revealed-1];try{cs.update({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4]});chart.timeScale().fitContent()}catch(e){}
  if(revealed>=s.post.length){clearInterval(timer);timer=null;draw();lesson()}},Math.max(15,1500/s.post.length))}
function lesson(){const s=cur,tfn=s.tf=="W"?"weeks":"days",cls=s.pct>=0?"up":"dn";
 const what=s.pat?s.pat[1][s.pat[2]]:"",wv=s.wave?s.wave[0][s.wave[1]]:"";
 const why=s.tier=="S"?"5R+ is elite.":s.tier=="A"?"3–5R is a great trade.":s.tier=="B"?"1.5–3R, tradeable, not special.":s.stophit?"the stop got hit first.":s.move=="chop"?"it chopped, no trade.":"under 1.5R.";
 const sh=s.move=="up"?`Long stop under ${f(s.swl)} ${s.stophit?"got hit":"held ✅"}.`:s.move=="down"?`Short stop over ${f(s.swh)} ${s.stophit?"got hit":"held ✅"}.`:"No clean direction.";
 $("qbox").innerHTML=`<h2 style="margin-top:14px">${s.title}</h2><p style="font-size:20px">You got <b>${answers.filter(x=>x).length}/${answers.length}</b> · +${roundPts} XP</p>
 <ul class="les"><li><b class="${cls}">${s.pct>0?"+":""}${s.pct}%</b> in ${s.fwd} ${tfn} (${f(s.c0)} → ${f(s.cend)})</li>
 ${what||wv?`<li>${what?"Pattern: <b>"+what+"</b>":""}${what&&wv?"<br>":""}${wv?"Wave: <b>"+wv+"</b>":""}</li>`:""}
 <li><span class="tier t${s.tier}">${s.tier}</span> ${s.R?s.R+"R":"0R"}: ${why}</li></ul>
 <details><summary>More: the full lesson</summary>${s.ctx?`<p><b>Setup:</b> ${s.ctx}</p>`:""}<p>${s.lesson}</p><p class="muted">Max run-up <span class="up">+${s.up}%</span>, max drawdown <span class="dn">−${s.dn}%</span>. ${sh} Risk = distance to the 20-bar swing ${s.move=="down"?"high":"low"}; reward = best real move within ${s.fwd} ${tfn}.</p></details>
 <button class="big" onclick="next()">${ri+1<run.length?"Next chart ▶":"Finish run 🏁"}</button>`}
function next(){ri++;scrollTo(0,0);if(ri<run.length)load();else{show("home");hud();toast(`Run done! ${LV[lvl()][0]}`,"#facc15")}}
hud();
</script></body></html>
